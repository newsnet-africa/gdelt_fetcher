[package]
name = "models"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = []
gcam-hashmap = ["phf"]
wasm = []
netabase = ["dep:netabase_store"]

[dependencies]
log = "0.4"
env_logger = "0.10"
chrono = { version = "*", features = ["serde"] }
url = { version = "*", features = ["serde"] }
anyhow = "*"
csv = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Use bincode 2.0 for consistency with netabase
bincode = { version = "2.0", features = ["derive", "serde"] }
tempfile = "3.0"

# PHF for compile-time static HashMap (feature-gated)
phf = { version = "0.11", features = ["macros"], optional = true }

# Netabase for persistent storage (feature-gated)
# netabase_store = { git = "https://github.com/newsnet-africa/netabase_store.git", default-features = false, optional = true }
netabase_store = { path = "../../netabase_store", default-features = false, optional = true }
strum = { version = "0.27.2", features = ["derive"] }
