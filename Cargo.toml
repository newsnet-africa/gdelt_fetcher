[package]
name = "gdelt_fetcher"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = ["data/native", "models/native"]
gcam-hashmap = ["models/gcam-hashmap"]
wasm = ["data/wasm", "models/wasm"]
# Netabase storage features
netabase = ["data/netabase"]
native-netabase = ["native", "netabase", "data/netabase"]
wasm-netabase = ["wasm", "netabase", "data/wasm-netabase"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
data = {path = "./data"}
models = {path = "./models"}
env_logger = "*"
tokio = "*"
csv = "1.3.1"
anyhow = "1.0.97"
log = "0.4.26"
chrono = "0.4.40"
async-trait = "0.1.88"
url = "2.5.4"
tokio-util = "0.7.15"
tempfile = { version = "3.20.0", features = ["nightly"] }

[[bin]]
name = "populate_gcam_db"
path = "populate_gcam_db.rs"

[[bin]]
name = "fix_csv_encoding"
path = "fix_csv_encoding.rs"

[[bin]]
name = "verify_gcam_enrichment"
path = "verify_gcam_enrichment.rs"
