[package]
name = "data"
version = "0.1.0"
edition = "2024"

[features]
default = []
wasm = []
netabase = ["dep:netabase_store", "dep:netabase_macros", "dep:netabase_deps", "netabase_store/native"]
wasm-netabase = ["wasm", "dep:netabase_store", "dep:netabase_macros", "dep:netabase_deps", "netabase_store/wasm"]

[dependencies]
anyhow = "*"
chrono = "*"
csv = "*"
url = "*"
models = { version = "*", path = "../models" }
log = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["derive", "serde"] }
strum = { version = "0.27.2", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["from", "try_into", "into"] }

# Netabase for masterfilelist storage (optional)
netabase_store = { path = "/home/rusta/Projects/NewsNet/netabase_store", optional = true }
netabase_macros = { path = "/home/rusta/Projects/NewsNet/netabase_store/netabase_macros", optional = true }
netabase_deps = { path = "/home/rusta/Projects/NewsNet/netabase_store/netabase_deps", optional = true }
# Non-WASM dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gcloud-bigquery = "*"
reqwest = "*"
tokio = { version = "*", features = ["full"] }
md5 = "*"
zip = "*"
flate2 = "1.0"
sled = "0.34"

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "*", default-features = false }
md5 = "*"
zip = { version = "*", default-features = false, features = ["deflate"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "RequestMode", "Response", "Window"] }
js-sys = "0.3"

[dev-dependencies]
tempfile = "3.0"
env_logger = "*"
