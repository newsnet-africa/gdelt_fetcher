[package]
name = "data"
version = "0.1.0"
edition = "2024"

[features]
default = []
wasm = []
netabase = ["dep:netabase_store", "dep:netabase_macros", "dep:netabase_deps"]
wasm-netabase = ["wasm", "netabase", "netabase_store/wasm"]

[dependencies]
anyhow = "*"
chrono = "*"
csv = "*"
url = "*"
models = { version = "*", path = "../models" }
log = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["derive", "serde"] }
# Non-WASM dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gcloud-bigquery = "*"
reqwest = "*"
tokio = { version = "*", features = ["full"] }
md5 = "*"
zip = "*"
flate2 = "1.0"
sled = "0.34"

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "*", default-features = false }
md5 = "*"
zip = { version = "*", default-features = false, features = ["deflate"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "RequestMode", "Response", "Window"] }
js-sys = "0.3"

# Netabase for masterfilelist storage (optional)
netabase_store = { git = "https://github.com/newsnet-africa/netabase_store.git", default-features = false, optional = true }
netabase_macros = { git = "https://github.com/newsnet-africa/netabase_store.git", optional = true }
netabase_deps = { git = "https://github.com/newsnet-africa/netabase_store.git", optional = true }

[dev-dependencies]
tempfile = "3.0"
env_logger = "*"
